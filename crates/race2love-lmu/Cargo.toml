[package]
name = "race2love-lmu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Native LMU telemetry with a platform-independent byte decoder"

[dependencies]
race2love-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
tokio.workspace = true

# Maintained Bytecode Alliance bindings; tests only, for real Linux memfds.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

# Only windows.rs opts into unsafe Win32 access. Linux reads and parsing are safe.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
